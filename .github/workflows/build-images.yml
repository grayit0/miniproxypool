name: build-images

# 构建 manager / node 两个镜像并推送到 GitHub Container Registry（GHCR）。
#   ghcr.io/<owner>/<repo>-manager:latest
#   ghcr.io/<owner>/<repo>-node:latest
#
# 非 PR 事件会额外跑一个冒烟任务：把刚推上去的镜像真跑起来，
# 用客户端经代理访问外网，确认镜像不是「能构建但跑不起来」。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            context: ./manager
          - name: node
            context: ./node-go
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 镜像摘要
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: 用推上去的镜像跑通链路
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取镜像
        run: |
          docker pull "$IMAGE_PREFIX-manager:latest"
          docker pull "$IMAGE_PREFIX-node:latest"

      - name: 起 manager 与 2 个 node
        run: |
          docker network create proxypool
          docker run -d --name manager --network proxypool --hostname manager \
            -p 8000:8000 -e LOG_LEVEL=INFO "$IMAGE_PREFIX-manager:latest"
          for i in 1 2; do
            docker run -d --name "node$i" --network proxypool --hostname "node$i" \
              -p "1880$i:8888" \
              -e MANAGER_URL=http://manager:8000 \
              -e NODE_HOST="node$i" -e NODE_NAME="node$i" \
              -e PROXY_PORT=8888 -e ADMIN_PORT=8000 \
              -e EGRESS_HOST=127.0.0.1 -e EGRESS_PORT="1880$i" \
              "$IMAGE_PREFIX-node:latest"
          done
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}'

      - name: 冒烟测试（经代理访问外网）
        run: |
          python3 -m pip install --quiet requests
          python3 tests/ci_smoke.py --manager http://127.0.0.1:8000 --min-nodes 2

      - name: 结果写进 Summary
        if: success()
        run: |
          {
            echo "## 冒烟测试通过"
            echo
            echo '镜像已发布：'
            echo
            echo '```'
            echo "$IMAGE_PREFIX-manager:latest"
            echo "$IMAGE_PREFIX-node:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时打印日志
        if: failure()
        run: |
          for c in manager node1 node2; do
            echo "===== $c ====="
            docker logs "$c" 2>&1 | tail -n 80 || true
          done

      - name: 清理
        if: always()
        run: docker rm -f manager node1 node2 >/dev/null 2>&1 || true
